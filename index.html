<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#181c23" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Harden">
  <meta name="robots" content="noindex">
  <title>Harden</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app" id="appHeader"></header>
  <main class="wrap stack" id="view"><p class="empty">Caricamento…</p></main>

  <div class="dock">
    <div class="timer" id="timer" hidden>
      <div class="t" id="tVal">0:00</div>
      <div class="info"><div id="tInfo">Recupero</div><div class="bar"><i id="tBar"></i></div></div>
      <button id="tMinus" aria-label="Togli 15 secondi">−15</button>
      <button id="tPlus" aria-label="Aggiungi 15 secondi">+15</button>
      <button id="tStop">Stop</button>
    </div>
    <nav class="tabs" aria-label="Sezioni">
      <button data-view="home" aria-selected="true">Home</button>
      <button data-view="workout">Sessione</button>
      <button data-view="logbook">Logbook</button>
      <button data-view="measures">Misure</button>
      <button data-view="report">Report</button>
    </nav>
  </div>

  <div id="modalHost"></div>
  <noscript>Harden ha bisogno di JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
